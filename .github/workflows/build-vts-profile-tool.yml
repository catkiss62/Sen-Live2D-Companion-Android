name: Build Sen VTS Parameter Capture Tool

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/vts-profile-capture/**'
      - '.github/workflows/build-vts-profile-tool.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.16.0 -r tools/vts-profile-capture/requirements.txt

      - name: Build Windows executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Sen-VTS-Parameter-Capture --collect-submodules websocket tools/vts-profile-capture/sen_vts_capture.py

      - name: Package executable and notices
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/Sen-VTS-Parameter-Capture.exe package/
          Copy-Item tools/vts-profile-capture/README.md package/
          Copy-Item tools/vts-profile-capture/THIRD_PARTY_NOTICES.txt package/
          Compress-Archive -Path package/* -DestinationPath Sen-VTS-Parameter-Capture-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Sen-VTS-Parameter-Capture-Windows
          path: Sen-VTS-Parameter-Capture-Windows.zip
          if-no-files-found: error
          retention-days: 14
