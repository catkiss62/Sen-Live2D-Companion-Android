name: Build Sen Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned Live2D Cubism 5 Web SDK samples
        run: |
          git clone --recursive https://github.com/Live2D/CubismWebSamples.git /tmp/CubismWebSamples
          git -C /tmp/CubismWebSamples checkout b1de66b0b1f1cb881d95fb6158622aeb6a2827bd
          git -C /tmp/CubismWebSamples submodule update --init --recursive
          test "$(git -C /tmp/CubismWebSamples/Framework rev-parse HEAD)" = "d4da0aa07e47d2c1e4f5fa7ea6047861ea5e5d0b"

      - name: Apply Sen stage overlay
        run: |
          DEMO=/tmp/CubismWebSamples/Samples/TypeScript/Demo
          cp web-overlay/index.html "$DEMO/index.html"
          cp web-overlay/copy_resources.js "$DEMO/copy_resources.js"
          cp web-overlay/vite.config.mts "$DEMO/vite.config.mts"
          cp web-overlay/src/*.ts "$DEMO/src/"
          node web-overlay/patch_sample.mjs "$DEMO/src/lappmodel.ts"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build official Cubism 5 web stage
        working-directory: /tmp/CubismWebSamples/Samples/TypeScript/Demo
        run: npm ci && npm run build:prod

      - name: Package web stage as Android assets
        run: |
          mkdir -p app/src/main/assets/stage
          cp -R /tmp/CubismWebSamples/Samples/TypeScript/Demo/dist/. app/src/main/assets/stage/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        id: android_build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee android-build.log

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sen-Android-Build-Log
          path: android-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Report failure for automatic repair
        if: steps.android_build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Workflow run ID: ${{ github.run_id }}"
            echo "Commit checked out: $(git rev-parse HEAD)"
            echo
            echo '```text'
            tail -n 180 android-build.log
            echo '```'
          } > build-failure.md
          gh issue create --title "Sen APK build failure · run ${{ github.run_id }}" --body-file build-failure.md

      - uses: actions/upload-artifact@v4
        if: steps.android_build.outcome == 'success'
        with:
          name: Sen-Live2D-Renderer-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Report successful APK
        if: steps.android_build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Sen APK build success · run ${{ github.run_id }}" \
            --body "Sen renderer test built successfully from commit $(git rev-parse HEAD). Artifact: Sen-Live2D-Renderer-Test-APK"

      - name: Mark failed build
        if: steps.android_build.outcome == 'failure'
        run: exit 1
