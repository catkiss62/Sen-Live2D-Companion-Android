name: Build Sen Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        id: android_build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee android-build.log

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sen-Android-Build-Log
          path: android-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Report failure for automatic repair
        if: steps.android_build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Workflow run ID: ${{ github.run_id }}"
            echo "Commit checked out: $(git rev-parse HEAD)"
            echo
            echo '```text'
            tail -n 180 android-build.log
            echo '```'
          } > build-failure.md
          gh issue create --title "Sen APK build failure · run ${{ github.run_id }}" --body-file build-failure.md

      - uses: actions/upload-artifact@v4
        if: steps.android_build.outcome == 'success'
        with:
          name: Sen-Live2D-Renderer-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Report successful APK
        if: steps.android_build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Sen APK build success · run ${{ github.run_id }}" \
            --body "Sen renderer test built successfully from commit $(git rev-parse HEAD). Artifact: Sen-Live2D-Renderer-Test-APK"

      - name: Mark failed build
        if: steps.android_build.outcome == 'failure'
        run: exit 1
